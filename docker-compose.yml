x-logging: &default-logging
  options:
    max-size: "40m"
    max-file: "10"
  driver: json-file

services:
  social-fish:
    container_name: social-fish
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    # Username is: user
    # Password is: password
    command: "python SocialFish.py user password"
